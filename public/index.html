<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風チャット</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #7494c0; }
        
        .chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; background: #7494c0; }
        .chat-header { background: #273246; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        
        /* ログイン画面 */
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 12px; }
        .login-box button { width: 100%; padding: 12px; font-size: 16px; background: #06c755; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* トーク画面 */
        .chat-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .message-row { display: flex; flex-direction: column; max-width: 75%; }
        .message-row.my-msg { align-self: flex-end; align-items: flex-end; }
        .message-row.other-msg { align-self: flex-start; align-items: flex-start; }

        .sender-name { font-size: 12px; color: #ffffff; margin-bottom: 3px; margin-left: 2px; }
        
        .bubble-wrapper { display: flex; align-items: flex-end; gap: 5px; }
        .my-msg .bubble-wrapper { flex-direction: row-reverse; }

        .bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-break: break-word; }
        .other-msg .bubble { background: white; color: #000; border-top-left-radius: 2px; }
        .my-msg .bubble { background: #85e249; color: #000; border-top-right-radius: 2px; }

        /* 既読 ＆ 時刻表示 */
        .meta-info { display: flex; flex-direction: column; align-items: flex-end; font-size: 10px; color: #e2e2e2; }
        .read-status { color: #ffffff; font-weight: bold; }

        /* 入力エリア */
        .chat-footer { background: white; padding: 10px; display: flex; gap: 8px; align-items: center; }
        .chat-footer input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 15px; outline: none; }
        .chat-footer button { background: #06c755; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h3>💬 トークに参加</h3>
        <input type="text" id="usernameInput" placeholder="お名前を入力">
        <button id="joinBtn">スタート</button>
    </div>
</div>

<div class="chat-container">
    <div class="chat-header">LINE風グループトーク</div>
    
    <div class="chat-body" id="chatBody"></div>

    <div class="chat-footer">
        <input type="text" id="messageInput" placeholder="メッセージを入力..." autocomplete="off">
        <button id="sendBtn">送信</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myName = '';
    let currentHistory = [];

    const loginOverlay = document.getElementById('loginOverlay');
    const usernameInput = document.getElementById('usernameInput');
    const joinBtn = document.getElementById('joinBtn');
    const chatBody = document.getElementById('chatBody');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // 読み込み時の自動復帰チェック
    window.addEventListener('load', () => {
        const savedName = sessionStorage.getItem('line_user_name');
        if (savedName) {
            myName = savedName;
            loginOverlay.classList.add('hidden');
        }
    });

    // 「スタート」ボタン押下時
    joinBtn.addEventListener('click', () => {
        const name = usernameInput.value.trim();
        if (name) {
            myName = name;
            sessionStorage.setItem('line_user_name', name);
            loginOverlay.classList.add('hidden');

            // ログイン完了後に既存のメッセージすべてへ既読を送信
            currentHistory.forEach(msg => sendReadReceipt(msg));
        }
    });

    // 過去履歴の受取
    socket.on('init-history', (history) => {
        currentHistory = history;
        chatBody.innerHTML = '';
        history.forEach(msg => {
            appendMessage(msg);
            if (myName) sendReadReceipt(msg);
        });
        scrollToBottom();
    });

    // 新着メッセージ受取
    socket.on('new-message', (msg) => {
        currentHistory.push(msg);
        appendMessage(msg);
        if (myName) sendReadReceipt(msg);
        scrollToBottom();
    });

    // 既読数の更新を受信したとき
    socket.on('update-read-count', (data) => {
        const readEl = document.getElementById(`read-${data.msgId}`);
        if (readEl) {
            readEl.textContent = `既読 ${data.readCount}`;
            readEl.classList.remove('hidden');
        }
    });

    // 既読通知を送る関数
    function sendReadReceipt(msg) {
        if (msg.name !== myName && myName !== '') {
            socket.emit('read-message', { msgId: msg.id, userName: myName });
        }
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (text && myName) {
            socket.emit('send-message', { name: myName, text: text });
            messageInput.value = '';
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function appendMessage(msg) {
        const isMe = (msg.name === myName);
        const row = document.createElement('div');
        row.className = `message-row ${isMe ? 'my-msg' : 'other-msg'}`;

        const isReadVisible = isMe && msg.readCount > 0;

        let html = '';
        if (!isMe) {
            html += `<div class="sender-name">${escapeHtml(msg.name)}</div>`;
        }
        
        html += `
            <div class="bubble-wrapper">
                <div class="bubble">${escapeHtml(msg.text)}</div>
                <div class="meta-info">
                    <span class="read-status ${isReadVisible ? '' : 'hidden'}" id="read-${msg.id}">既読 ${msg.readCount || ''}</span>
                    <span>${msg.time}</span>
                </div>
            </div>
        `;

        row.innerHTML = html;
        chatBody.appendChild(row);
    }

    function scrollToBottom() {
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
