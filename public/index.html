<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風 チャットアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h2>💬 LINE風チャット</h2>
            <p>名前と部屋名を入力してください</p>

            <div class="input-group">
                <label>お名前</label>
                <input type="text" id="username-input" placeholder="例: たろう" required>
            </div>

            <div class="input-group">
                <label>部屋名（キーワード）</label>
                <input type="text" id="room-input" placeholder="例: room123" value="自由広場">
                <small>※同じ部屋名を入れた人と会話できます</small>
            </div>

            <button id="join-btn">チャットを始める</button>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div class="chat-header">
            <button id="leave-btn" class="back-btn">‹ 退出</button>
            <div class="header-info">
                <h3 id="display-room-name">トークルーム</h3>
                <span id="user-count" class="online-badge">オンライン: 1人</span>
            </div>
            <div class="spacer"></div>
        </div>

        <div class="chat-body" id="chat-body"></div>

        <form id="chat-form" class="chat-footer">
            <input type="text" id="message-input" placeholder="メッセージを入力" autocomplete="off" required>
            <button type="submit" id="send-btn">送信</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
